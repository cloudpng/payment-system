{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 3rem auto;">
    <h2>🔐 System Login</h2>
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="registrar / director / accounts / finance">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Same as role name">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    <p style="margin-top: 1rem; color: #7f8c8d; font-size: 0.9rem;">
        Demo credentials: username = role name, password = role name<br>
        Roles: registrar, director, accounts, finance
    </p>
</div>
{% endblock %}
